<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙明亮，欢迎光临</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Noto Sans SC", system-ui, sans-serif;
      background-color: #ffffff;
      background-image:
        linear-gradient(#dbeafe 1px, transparent 1px),
        linear-gradient(90deg, #dbeafe 1px, transparent 1px);
      background-size: 32px 32px;
      background-attachment: fixed;
    }
    .option-btn.selected { outline: 2px solid #2563eb; background: #eff6ff; }
    .option-btn.correct { outline: 2px solid #16a34a; background: #f0fdf4; }
    .option-btn.wrong { outline: 2px solid #dc2626; background: #fef2f2; }
    .tab-active { color: #1d4ed8; border-bottom: 2px solid #2563eb; font-weight: 600; }
    /* 全站统一四号字 */
    * { font-size: 14pt !important; }
    /* 题干与解析：段首空两字符、两端对齐 */
    #stem, #result-explain { text-align: justify; text-indent: 2em; }
    /* 选项居左对齐（覆盖居中设置） */
    #options .option-btn { text-align: left; }
  </style>
</head>
<body class="text-slate-800 min-h-screen">
  <!-- 登录层 -->
  <div id="login-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-[90%] max-w-sm">
      <h1 class="text-xl font-semibold mb-2">宇宙明亮，欢迎光临</h1>
      <input id="pwd-input" type="password" placeholder="请输入访问密码"
        class="w-full border rounded-lg px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button id="pwd-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2">进入</button>
      <p id="pwd-error" class="text-red-500 text-sm mt-2 hidden">密码错误</p>
    </div>
  </div>

  <header class="bg-transparent border-b border-slate-200 sticky top-0 z-10 transition-transform duration-300">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="font-semibold">宇宙明亮，欢迎光临</div>
      <div class="flex items-center gap-2">
        <button id="home-btn" class="text-sm px-3 py-1 rounded-lg border hover:bg-slate-50">首页</button>
        <button id="reload-btn" class="text-sm px-3 py-1 rounded-lg border hover:bg-slate-50">刷新</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">

    <!-- 导航首页 -->
    <section id="view-home">
      <h2 class="text-lg font-semibold mb-4">请选择进入：</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <button data-nav="practice" class="nav-card text-left bg-white border rounded-xl p-6 shadow-sm hover:shadow-md hover:border-blue-400 transition cursor-pointer">
          <div class="text-xl font-semibold mb-1">📝 刷题</div>
          <p class="text-sm text-slate-500">按科目抽题练习，答完即时判分并展示解析与考点。</p>
        </button>
        <button data-nav="wrong" class="nav-card text-left bg-white border rounded-xl p-6 shadow-sm hover:shadow-md hover:border-blue-400 transition cursor-pointer">
          <div class="text-xl font-semibold mb-1">📒 错题本 <span id="wrong-badge-home" class="ml-1 inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1 rounded-full bg-red-100 text-red-700 text-xs align-middle">0</span></div>
          <p class="text-sm text-slate-500">浏览与重练答错的题目，数据保存在本机浏览器。</p>
        </button>
        <button data-nav="feishu" class="nav-card text-left bg-white border rounded-xl p-6 shadow-sm hover:shadow-md hover:border-blue-400 transition cursor-pointer">
          <div class="text-xl font-semibold mb-1">📊 飞书表格</div>
          <p class="text-sm text-slate-500">查看嵌入的飞书多维表格（需配置公开嵌入链接）。</p>
        </button>
      </div>
    </section>

    <!-- 刷题 -->
    <section id="view-practice">
      <div id="empty-state" class="hidden bg-white border rounded-xl p-8 text-center text-slate-500">
        暂无题目。请导入飞书表，或确认 data/questions.sample.json 存在。
      </div>

      <div id="quiz-panel" class="hidden">
        <div class="flex items-center justify-between mb-3 gap-2 flex-wrap text-sm text-slate-500">
          <div id="sync-status" class="text-xs text-slate-500">题库同步中…</div>
          <div class="flex items-center gap-2 flex-wrap">
            第 <span id="q-index">1</span> / <span id="q-total">0</span> 题
            <span id="q-meta" class="ml-2"></span>
            <span id="practice-mode-tag" class="hidden ml-2 text-xs px-2 py-0.5 rounded bg-red-50 text-red-600">错题重练</span>
          </div>
        </div>

        <div class="bg-white border rounded-xl p-5 shadow-sm text-center">
          <div class="flex items-center gap-2 mb-3">
            <select id="subject-select" class="border rounded-lg px-2 py-1 text-sm bg-white">
              <option value="">全部科目</option>
              <option value="民法">民法</option>
              <option value="刑法">刑法</option>
              <option value="民诉">民诉</option>
              <option value="刑事诉讼法">刑诉</option>
              <option value="理论法">理论法</option>
              <option value="商经知">商经知</option>
              <option value="三国法">三国法</option>
              <option value="行政法" selected>行政法</option>
            </select>
            <span id="badge-type" class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 text-xs"></span>
          </div>
          <div id="stem" class="text-base leading-7 mb-4"></div>
          <div id="options" class="space-y-2 mb-4"></div>
          <div class="flex flex-wrap justify-center gap-2">
            <button id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">提交本题</button>
            <button id="prev-btn" class="px-4 py-2 border rounded-lg text-sm">上一题</button>
            <button id="next-btn" class="px-4 py-2 border rounded-lg text-sm">下一题</button>
            <button id="add-wrong-btn" class="hidden border border-red-200 text-red-600 px-4 py-2 rounded-lg text-sm hover:bg-red-50">加入错题本</button>
          </div>
          <div id="result-box" class="hidden mt-4 border-t pt-4">
            <div id="result-line" class="font-medium mb-2"></div>
            <div class="text-sm text-slate-600 mb-1">考点：<span id="result-point"></span></div>
            <div class="text-sm leading-6 whitespace-pre-wrap bg-slate-50 rounded-lg p-3" id="result-explain"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 错题本 -->
    <section id="view-wrong" class="hidden">
      <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
        <div>
          <h2 class="font-semibold">错题本</h2>
          <p class="text-xs text-slate-500 mt-0.5">保存在本机浏览器（localStorage），换设备不同步</p>
        </div>
        <div class="flex gap-2">
          <button id="wrong-practice-all" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm">全部重练</button>
          <button id="wrong-clear" class="border px-3 py-1.5 rounded-lg text-sm text-red-600 hover:bg-red-50">清空错题</button>
        </div>
      </div>

      <div id="wrong-empty" class="bg-white border rounded-xl p-8 text-center text-slate-500">
        暂无错题。刷题答错后会自动收录。
      </div>

      <div id="wrong-list" class="space-y-3"></div>
    </section>

    <!-- 飞书表格（多张表各占一个子标签） -->
    <section id="view-feishu" class="hidden">
      <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
        <div>
          <h2 class="font-semibold">飞书表格</h2>
          <p class="text-xs text-slate-500 mt-0.5">嵌入的飞书多维表格（需在飞书开启「公开分享 + 允许嵌入」）</p>
        </div>
      </div>
      <div id="feishu-subtabs" class="flex gap-2 mb-3 flex-wrap"></div>
      <div id="feishu-frame-wrap" class="bg-white border rounded-xl overflow-hidden hidden" style="height:74vh;">
        <iframe id="feishu-frame" class="w-full h-full" style="border:0;" src=""></iframe>
      </div>
      <div id="feishu-empty" class="bg-white border rounded-xl p-8 text-center text-slate-500">
        尚未配置飞书表嵌入链接。请在站点脚本顶部的 <code>FEISHU_TABLES</code> 中填入每张表的公开嵌入链接（src 地址）。
      </div>
    </section>

  </main>

  <script>
    const CORRECT_PASSWORD = "2026";
    const API_BASE = "/api";
    const WRONG_KEY = "law_wrong_book_v1";

    // 飞书多维表格嵌入配置：每张表 = 一个子标签。
    // 在飞书把对应多维表格设为「公开分享 + 允许嵌入」后，把分享链接（iframe 的 src）填到 url。
    const FEISHU_TABLES = [
      // 示例：
      // { name: "题目总表", url: "https://www.feishu.cn/base/xxxxxxxx?table=yyyyyyyy&view=zzzzzz&mode=view" },
      // { name: "统计表",   url: "https://www.feishu.cn/base/aaaaaaaa?table=bbbbbbbb&mode=view" },
    ];

    let allQuestions = [];   // 当前科目下题库
    let questions = [];      // 当前练习队列
    let idx = 0;
    let selected = new Set();
    let submitted = false;
    let practiceMode = "all"; // all | wrong
    let currentView = "practice"; // practice | wrong

    // ---------- 错题本存储 ----------
    function loadWrongBook() {
      try {
        return JSON.parse(localStorage.getItem(WRONG_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveWrongBook(book) {
      localStorage.setItem(WRONG_KEY, JSON.stringify(book));
      updateWrongBadge();
    }

    function wrongCount() {
      return Object.keys(loadWrongBook()).length;
    }

    function isInWrongBook(id) {
      return Boolean(id && loadWrongBook()[id]);
    }

    function addToWrongBook(q, userAnswer) {
      if (!q || !q.题目ID) return;
      const book = loadWrongBook();
      const prev = book[q.题目ID] || {};
      book[q.题目ID] = {
        题目ID: q.题目ID,
        科目: q.科目 || "",
        编章: q.编章 || "",
        章节: q.章节 || "",
        题型: q.题型 || "",
        题干: q.题干 || "",
        选项A: q.选项A || "",
        选项B: q.选项B || "",
        选项C: q.选项C || "",
        选项D: q.选项D || "",
        选项E: q.选项E || "",
        答案: q.答案 || "",
        解析: q.解析 || "",
        考点: q.考点 || "",
        难度: q.难度 || "",
        来源: q.来源 || "",
        wrongCount: (prev.wrongCount || 0) + 1,
        lastWrongAt: new Date().toISOString(),
        lastUserAnswer: userAnswer || "",
      };
      saveWrongBook(book);
    }

    function removeFromWrongBook(id) {
      if (!id) return;
      const book = loadWrongBook();
      delete book[id];
      saveWrongBook(book);
    }

    function clearWrongBook() {
      localStorage.removeItem(WRONG_KEY);
      updateWrongBadge();
    }

    function updateWrongBadge() {
      const n = wrongCount();
      const el = document.getElementById("wrong-badge");
      if (el) {
        el.textContent = String(n);
        el.classList.toggle("bg-red-100", n > 0);
        el.classList.toggle("text-red-700", n > 0);
        el.classList.toggle("bg-slate-100", n === 0);
        el.classList.toggle("text-slate-500", n === 0);
      }
      updateHomeWrongBadge();
    }

    function wrongBookList() {
      return Object.values(loadWrongBook()).sort((a, b) =>
        String(b.lastWrongAt || "").localeCompare(String(a.lastWrongAt || ""))
      );
    }

    // ---------- 登录 ----------
    function checkAuth() {
      if (sessionStorage.getItem("law_auth") === "1") {
        document.getElementById("login-layer").classList.add("hidden");
      }
    }

    document.getElementById("pwd-btn").onclick = () => {
      const v = document.getElementById("pwd-input").value.trim();
      if (v === CORRECT_PASSWORD) {
        sessionStorage.setItem("law_auth", "1");
        document.getElementById("login-layer").classList.add("hidden");
      } else {
        document.getElementById("pwd-error").classList.remove("hidden");
      }
    };
    document.getElementById("pwd-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("pwd-btn").click();
    });

    // ---------- 工具 ----------
    function normalizeAnswer(ans) {
      return String(ans || "").replace(/[^A-Ea-e]/g, "").toUpperCase().split("").sort().join("");
    }

    function optionList(q) {
      return ["A", "B", "C", "D", "E"]
        .map((k) => ({ key: k, text: q["选项" + k] }))
        .filter((x) => x.text);
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function switchView(view) {
      currentView = view;
      const home = view === "home";
      document.getElementById("view-home").classList.toggle("hidden", !home);
      document.getElementById("view-practice").classList.toggle("hidden", view !== "practice");
      document.getElementById("view-wrong").classList.toggle("hidden", view !== "wrong");
      document.getElementById("view-feishu").classList.toggle("hidden", view !== "feishu");
      if (view === "wrong") renderWrongList();
      if (view === "feishu") renderFeishuTabs();
    }

    // ---------- 飞书表格多标签 ----------
    function renderFeishuTabs() {
      const sub = document.getElementById("feishu-subtabs");
      const frame = document.getElementById("feishu-frame");
      const wrap = document.getElementById("feishu-frame-wrap");
      const empty = document.getElementById("feishu-empty");
      sub.innerHTML = "";
      if (!FEISHU_TABLES.length) {
        wrap.classList.add("hidden");
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");
      wrap.classList.remove("hidden");
      FEISHU_TABLES.forEach((t, i) => {
        const b = document.createElement("button");
        const base = "feishu-subtab text-sm px-3 py-1.5 rounded-lg border ";
        b.className = base + (i === 0 ? "bg-blue-600 text-white" : "hover:bg-slate-50");
        b.textContent = t.name || ("表 " + (i + 1));
        b.onclick = () => {
          document.querySelectorAll(".feishu-subtab").forEach((x) => {
            x.className = base + "hover:bg-slate-50";
          });
          b.className = base + "bg-blue-600 text-white";
          frame.src = t.url || "";
        };
        sub.appendChild(b);
      });
      frame.src = FEISHU_TABLES[0].url || "";
    }

    // ---------- 刷题渲染 ----------
    function render() {
      if (!questions.length) {
        document.getElementById("quiz-panel").classList.add("hidden");
        document.getElementById("empty-state").classList.remove("hidden");
        document.getElementById("empty-state").textContent =
          practiceMode === "wrong"
            ? "错题本为空，或当前科目下没有对应错题。"
            : "暂无题目。请导入飞书表，或确认 data/questions.sample.json 存在。";
        return;
      }
      document.getElementById("empty-state").classList.add("hidden");
      document.getElementById("quiz-panel").classList.remove("hidden");

      const q = questions[idx];
      document.getElementById("q-index").textContent = String(idx + 1);
      document.getElementById("q-total").textContent = String(questions.length);
      document.getElementById("q-meta").textContent = q.题目ID || "";
      document.getElementById("practice-mode-tag").classList.toggle("hidden", practiceMode !== "wrong");
      document.getElementById("badge-type").textContent = q.题型 || "";
      document.getElementById("stem").textContent = q.题干 || "";

      const box = document.getElementById("options");
      box.innerHTML = "";
      for (const opt of optionList(q)) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn w-full text-left border rounded-lg px-3 py-2 text-sm hover:bg-slate-50";
        btn.dataset.key = opt.key;
        btn.innerHTML = `<span class="font-medium mr-2">${opt.key}.</span>${escapeHtml(opt.text)}`;
        if (selected.has(opt.key)) btn.classList.add("selected");
        btn.onclick = () => onPick(opt.key, q.题型);
        box.appendChild(btn);
      }

      const inBook = isInWrongBook(q.题目ID);
      document.getElementById("add-wrong-btn").classList.toggle("hidden", !submitted || inBook);

      document.getElementById("result-box").classList.add("hidden");
      if (submitted) showResult(q, false);
    }

    function onPick(key, type) {
      if (submitted) return;
      if (type === "多选") {
        if (selected.has(key)) selected.delete(key);
        else selected.add(key);
      } else {
        selected = new Set([key]);
      }
      document.querySelectorAll(".option-btn").forEach((el) => {
        el.classList.toggle("selected", selected.has(el.dataset.key));
        el.classList.remove("correct", "wrong");
      });
    }

    function showResult(q, autoSaveWrong) {
      const user = normalizeAnswer([...selected].join(""));
      const right = normalizeAnswer(q.答案);
      const ok = user && user === right;

      document.getElementById("result-box").classList.remove("hidden");
      document.getElementById("result-line").textContent = ok
        ? `✓ 正确（答案 ${right}）`
        : `✗ 错误（你的答案 ${user || "未选"}，正确答案 ${right}）`;
      document.getElementById("result-line").className =
        "font-medium mb-2 " + (ok ? "text-green-700" : "text-red-600");
      document.getElementById("result-point").textContent = q.考点 || "-";
      document.getElementById("result-explain").textContent = q.解析 || "暂无解析";

      document.querySelectorAll(".option-btn").forEach((el) => {
        const k = el.dataset.key;
        el.classList.remove("selected", "correct", "wrong");
        if (right.includes(k)) el.classList.add("correct");
        else if (user.includes(k)) el.classList.add("wrong");
      });

      if (autoSaveWrong && !ok) {
        addToWrongBook(q, user);
        // 错题重练中答对可选：自动移出（更符合刷题习惯，这里先保留，由用户手动移除）
      }

      const inBook = isInWrongBook(q.题目ID);
      document.getElementById("add-wrong-btn").classList.toggle("hidden", ok || inBook);

      if (currentView === "wrong") renderWrongList();
    }

    // ---------- 错题列表 ----------
    function renderWrongList() {
      const list = wrongBookList();
      const subject = document.getElementById("subject-select").value;
      const filtered = subject ? list.filter((x) => x.科目 === subject) : list;

      updateWrongBadge();
      const wrap = document.getElementById("wrong-list");
      const empty = document.getElementById("wrong-empty");

      if (!filtered.length) {
        empty.classList.remove("hidden");
        wrap.innerHTML = "";
        return;
      }
      empty.classList.add("hidden");
      wrap.innerHTML = filtered
        .map((q) => {
          const when = q.lastWrongAt ? new Date(q.lastWrongAt).toLocaleString() : "-";
          return `
          <div class="bg-white border rounded-xl p-4 shadow-sm">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="text-xs text-slate-500 mb-1">
                  ${escapeHtml(q.题目ID || "")}
                  · 错 ${q.wrongCount || 1} 次
                  · 最近 ${escapeHtml(when)}
                </div>
                <div class="text-sm leading-6 line-clamp-2">${escapeHtml(q.题干 || "")}</div>
                <div class="text-xs text-slate-500 mt-1">${escapeHtml([q.科目, q.章节, q.考点].filter(Boolean).join(" · "))}</div>
              </div>
              <div class="flex flex-col gap-2 shrink-0">
                <button data-act="practice" data-id="${escapeHtml(q.题目ID)}" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600 text-white">重练</button>
                <button data-act="remove" data-id="${escapeHtml(q.题目ID)}" class="text-xs px-3 py-1.5 rounded-lg border">移除</button>
              </div>
            </div>
          </div>`;
        })
        .join("");

      wrap.querySelectorAll("button[data-act]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.dataset.id;
          if (btn.dataset.act === "remove") {
            removeFromWrongBook(id);
            renderWrongList();
            return;
          }
          startWrongPractice([id]);
        };
      });
    }

    function startWrongPractice(onlyIds) {
      const book = loadWrongBook();
      let list;
      if (onlyIds && onlyIds.length) {
        list = onlyIds.map((id) => book[id]).filter(Boolean);
      } else {
        const subject = document.getElementById("subject-select").value;
        list = wrongBookList().filter((x) => !subject || x.科目 === subject);
      }
      if (!list.length) {
        alert("没有可重练的错题");
        return;
      }
      practiceMode = "wrong";
      questions = list;
      idx = 0;
      selected = new Set();
      submitted = false;
      switchView("practice");
      render();
    }

    // ---------- 事件 ----------
    document.getElementById("home-btn").onclick = () => switchView("home");

    // 导航首页：点击卡片进入对应模块
    document.querySelectorAll(".nav-card").forEach((btn) => {
      btn.onclick = () => {
        const v = btn.dataset.nav;
        if (v === "practice") {
          document.getElementById("subject-select").value = "行政法";
          switchView("practice");
          loadQuestions();
        } else if (v === "wrong") {
          switchView("wrong");
        } else {
          switchView("feishu");
        }
      };
    });

    // 同步首页错题数角标
    function updateHomeWrongBadge() {
      const n = wrongCount();
      const el = document.getElementById("wrong-badge-home");
      if (!el) return;
      el.textContent = String(n);
      el.classList.toggle("bg-red-100", n > 0);
      el.classList.toggle("text-red-700", n > 0);
      el.classList.toggle("bg-slate-100", n === 0);
      el.classList.toggle("text-slate-500", n === 0);
    }

    document.getElementById("submit-btn").onclick = () => {
      if (!questions.length) return;
      if (!selected.size) {
        alert("请先选择选项");
        return;
      }
      submitted = true;
      showResult(questions[idx], true);
    };
    document.getElementById("add-wrong-btn").onclick = () => {
      const q = questions[idx];
      if (!q) return;
      addToWrongBook(q, normalizeAnswer([...selected].join("")));
      render();
      if (currentView === "wrong") renderWrongList();
    };
    document.getElementById("prev-btn").onclick = () => {
      if (idx > 0) {
        idx -= 1;
        selected = new Set();
        submitted = false;
        render();
      }
    };
    document.getElementById("next-btn").onclick = () => {
      if (idx < questions.length - 1) {
        idx += 1;
        selected = new Set();
        submitted = false;
        render();
      }
    };
    document.getElementById("reload-btn").onclick = () => loadQuestions();
    document.getElementById("subject-select").onchange = () => {
      if (currentView === "wrong") renderWrongList();
      else loadQuestions();
    };

    document.getElementById("wrong-practice-all").onclick = () => startWrongPractice();
    document.getElementById("wrong-clear").onclick = () => {
      if (!wrongCount()) return;
      if (confirm("确定清空全部错题？此操作不可恢复。")) {
        clearWrongBook();
        renderWrongList();
        if (practiceMode === "wrong") {
          questions = [];
          render();
        }
      }
    };

    async function loadQuestions() {
      const subject = document.getElementById("subject-select").value;
      const qs = subject ? `?subject=${encodeURIComponent(subject)}` : "";
      document.getElementById("sync-status").textContent = "加载中…";
      try {
        const res = await fetch(`${API_BASE}/questions${qs}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "加载失败");
        let list = data.questions || [];
        let source = data.source || "unknown";
        // 飞书暂缺该科目数据时，回退本地打包题库（如 /data/questions.理论法.json）
        if (list.length === 0 && subject) {
          try {
            const localRes = await fetch(`/data/questions.${encodeURIComponent(subject)}.json`);
            if (localRes.ok) {
              const local = await localRes.json();
              const localList = (local.questions || local).filter(
                (q) => (!q.状态 || q.状态 === "已发布") && q.题目ID && q.题干
              );
              if (localList.length) {
                list = localList;
                source = "local";
              }
            }
          } catch (e) { /* 忽略本地回退失败 */ }
        }
        allQuestions = list;
        practiceMode = "all";
        questions = allQuestions.slice();
        idx = 0;
        selected = new Set();
        submitted = false;
        document.getElementById("sync-status").textContent =
          `✓ 已同步 ${questions.length} 题 · 来源 ${source} · 错题 ${wrongCount()}`;
        if (currentView === "practice") render();
        else renderWrongList();
      } catch (err) {
        document.getElementById("sync-status").textContent = "加载失败: " + err.message;
        allQuestions = [];
        questions = [];
        render();
      }
    }

    checkAuth();
    updateWrongBadge();
    switchView("home");
    document.getElementById("subject-select").value = "行政法";
    loadQuestions();

    // 滚动时自动隐藏/显示页头
    (function () {
      const header = document.querySelector("header");
      let lastY = window.scrollY;
      let ticking = false;
      const threshold = 8;

      function onScroll() {
        const y = window.scrollY;
        const delta = y - lastY;
        if (Math.abs(delta) <= threshold) {
          ticking = false;
          return;
        }
        if (delta > 0 && y > 60) {
          header.classList.add("-translate-y-full");
        } else {
          header.classList.remove("-translate-y-full");
        }
        lastY = y;
        ticking = false;
      }

      window.addEventListener("scroll", () => {
        if (!ticking) {
          window.requestAnimationFrame(onScroll);
          ticking = true;
        }
      });
    })();
  </script>
</body>
</html>
